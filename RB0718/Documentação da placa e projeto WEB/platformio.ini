; PlatformIO Project Configuration File for ROBOBUILDERS RB0718 ESP32 Dev Kit (Type-C)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = COM3
monitor_port = COM3

upload_flags =
    --no-stub

board_build.flash_mode = dio
board_build.f_flash = 40000000L

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.4

build_flags =
    -D CORE_DEBUG_LEVEL=2
