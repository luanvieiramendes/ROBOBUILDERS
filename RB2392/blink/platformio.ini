; Blink para ESP32-C6 Mini (modulo ESP32-C6-MINI-1, 4 MB de flash)
; Placa conectada na porta COM4 (USB Serial/JTAG nativa)

[env:esp32-c6-mini]
platform = espressif32@^8.0.0
board = esp32-c6-devkitm-1
framework = arduino

; Porta e velocidade de gravacao
upload_port = COM4
upload_speed = 460800
monitor_port = COM4
monitor_speed = 115200

; Pinos dos LEDs onboard (ajuste se a sua placa for diferente)
;   LED_PIN     -> LED simples (GPIO15 no ESP32-C6 SuperMini/Mini)
;   RGB_LED_PIN -> LED RGB WS2812 (GPIO8 no ESP32-C6 SuperMini/Mini)
build_flags =
    -D LED_PIN=15
    -D RGB_LED_PIN=8
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
