name: Build and Release Firmware

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-platformio

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          pip install platformio

      - name: Build firmware
        run: |
          pio run -e esp32-8048s070
          ls -lh .pio/build/esp32-8048s070/firmware.bin
          cp .pio/build/esp32-8048s070/firmware.bin firmware-${{ github.ref_name }}.bin
          cp .pio/build/esp32-8048s070/firmware.bin firmware-latest.bin
          echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Upload artifact (bin)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            firmware-*.bin
            firmware-latest.bin
          retention-days: 30

      - name: Create Release (only on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware-*.bin
            firmware-latest.bin
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
