; PlatformIO Project Configuration File for ESP-32_RELAY_30A_X8_V1.2 (8 Canais de Relé 30A)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.4
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

build_flags =
    -D CORE_DEBUG_LEVEL=2
