; PlatformIO Project Configuration File for ROBOBUILDERS RB2559 ESP32 (ESP-32 RELAY_X8)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = COM3
monitor_port = COM3

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.4

build_flags =
    -D CORE_DEBUG_LEVEL=2
